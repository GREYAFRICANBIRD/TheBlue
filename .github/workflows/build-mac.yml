name: Build macOS App

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build macOS App with PyInstaller
      run: |
        cd mac_version
        pyinstaller --onefile --windowed --name "OwOBotMac" show_discord_mac.py
        cp config.json dist/

    - name: Package macOS App into ZIP
      run: |
        cd mac_version/dist
        zip -r OwOBotMac-macOS.zip OwOBotMac.app config.json

    - name: Upload macOS Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OwOBotMac-macOS
        path: mac_version/dist/OwOBotMac-macOS.zip
        retention-days: 30
