name: Build and Release (Windows & macOS)

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller uiautomation psutil

    - name: Build Windows Executable
      shell: pwsh
      run: |
        cd window_version
        pyinstaller --onefile show_discord_window.py
        Copy-Item -Path config.json -Destination dist/config.json -Force
        cd dist
        Compress-Archive -Path show_discord_window.exe, config.json -DestinationPath OwOBot-Windows.zip -Force

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OwOBot-Windows
        path: window_version/dist/OwOBot-Windows.zip
        retention-days: 30

  build-macos:
    name: Build macOS (.app)
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build macOS App
      run: |
        cd mac_version
        pyinstaller --onefile --windowed --name "OwOBotMac" show_discord_mac.py
        cp config.json dist/
        cd dist
        zip -r OwOBotMac-macOS.zip OwOBotMac.app config.json

    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OwOBotMac-macOS
        path: mac_version/dist/OwOBotMac-macOS.zip
        retention-days: 30

  publish-release:
    name: Publish Release (GitHub Releases)
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    steps:
    - name: Download Windows build
      uses: actions/download-artifact@v4
      with:
        name: OwOBot-Windows
        path: release-assets

    - name: Download macOS build
      uses: actions/download-artifact@v4
      with:
        name: OwOBotMac-macOS
        path: release-assets

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
        name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Release (Windows & macOS)' }}
        body: |
          ## 📦 Tải bản cài đặt tự động:
          * **🪟 Windows (.exe)**: Tải tệp `OwOBot-Windows.zip` (Bên trong gồm `show_discord_window.exe` và `config.json`).
          * **🍎 macOS (.app)**: Tải tệp `OwOBotMac-macOS.zip` (Bên trong gồm `OwOBotMac.app` và `config.json`).
        files: |
          release-assets/OwOBot-Windows.zip
          release-assets/OwOBotMac-macOS.zip
